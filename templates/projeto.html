<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Projeto | Guilherme Donizetti</title>

    <meta name="description" content="Case técnico de projeto envolvendo tecnologias." />
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="project-page">
    <input type="hidden" id="numeroProjeto" value="">
    <header class="site-header">
    </header>

    <main class="project-main">
        <section class="project-section project-hero">
            <div>
                <span class="section-kicker"><span id="topico"></span></span>

                <h1 class="project-title">
                    <span id="tituloProjeto"></span>
                </h1>

                <p class="project-lead">
                    <span id="subtitulo"></span>
                </p>

                <div class="tags project-tags">
                    <span id="tags"></span>
                </div>
            </div>

            <figure class="project-cover project-cover--contain" id="imagem_principal"></figure>
        </section>

        <section class="project-section">
            <div class="project-grid project-grid--meta">
                <aside class="project-panel glass">
                    <span class="section-kicker">project.metadata</span>

                    <div class="project-meta-list">
                        <div class="project-meta-item">
                            <span>tipo</span>
                            <strong><p id="tipo"></p></strong>
                        </div>

                        <div class="project-meta-item">
                            <span>domínio</span>
                            <strong><p id="dominio"></p></strong>
                        </div>

                        <div class="project-meta-item">
                            <span>papel técnico</span>
                            <strong><p id="papel_tecnico"></p></strong>
                        </div>

                        <div class="project-meta-item">
                            <span>complexidade</span>
                            <strong><p id="complexidade"></p></strong>
                        </div>
                    </div>
                </aside>

                <article class="project-panel glass">
                    <span class="section-kicker">contexto</span>
                    <h2>O problema</h2>
                    <span id="contexto"></span>
                </article>
            </div>
        </section>

        <section class="project-section">
            <article class="project-panel glass">
                <span class="section-kicker">solution.architecture</span>
                <h2>Arquitetura da solução</h2>
                <p id="arquitetura"></p>

                <div class="project-architecture-grid" id="cards_arquitetura">
                    <!-- aqui nao tem span para essa propriedade -->
                </div>
            </article>
        </section>

        <section class="project-section">
            <div class="project-decision-grid" id="decisao">
                <!-- aqui nao tem span para essa propriedade -->
            </div>
        </section>

        <section class="project-section">
            <div class="project-grid project-grid--half">
                <article class="project-panel glass">
                    <span class="section-kicker">stack</span>
                    <h2>Tecnologias e conceitos</h2>

                    <p id="tecnologias"></p>

                    <div class="tags" id="tags_tecnologias_span"></div>
                </article>

                <article class="project-panel glass">
                    <span class="section-kicker">technical.role</span>
                    <h2>Atuação técnica</h2>

                    <p id="atuacao"></p>
                </article>
            </div>
        </section>

        <section class="project-section">
            <div class="project-gallery" id="galeria"></div>
        </section>

        <section class="project-section">
            <div class="project-next">
                <span id="proximo_projeto"></span>

                <a class="project-next-link" href="../index.html#projetos">
                    <span>portfolio.index</span>
                    <strong>Voltar para projetos →</strong>
                </a>
            </div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/jquery.dropotron.min.js"></script>
    <script src="../assets/js/jquery.scrolly.min.js"></script>
    <script src="../assets/js/jquery.scrollex.min.js"></script>
    <script src="../assets/js/browser.min.js"></script>
    <script src="../assets/js/breakpoints.min.js"></script>
    <script src="../assets/js/util.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootbox.js/4.4.0/bootbox.min.js"></script>

    <script>
        // PEGAR CODIGO DO PROJETO PARA ATUALIZAR CONTEUDO DA PAGINA
        const urlParams = new URLSearchParams(window.location.search);
        const cod = urlParams.get("cod");
        $("#numeroProjeto").val(cod);
    </script>

    <script src="../assets/js/descricoes_projetos.js"></script>
</body>

</html>
